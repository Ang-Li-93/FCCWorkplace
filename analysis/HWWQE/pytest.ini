[pytest]
testpaths = tests
pythonpath = .
# The Key4hep stack registers GaudiTesting pytest plugins that print CTest XML; disable them.
addopts = -ra -p no:ctest_measurements_reporter -p no:collect_for_ctest -p no:gaudi_fixtures
markers =
    slow: long-running statistical test (deselect with -m "not slow")
